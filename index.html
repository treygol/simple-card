<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Card</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      width: min(420px, 90%);
      padding: 32px;
      border-radius: 16px;
      background: #1e293b;
    }
    h1 { margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #94a3b8; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Treygol</h1>
    <p>My first GitHub project. A simple personal card page.</p>
    <a href="https://github.com/treygol">My GitHub</a>
  </div>
</body>
</html>
